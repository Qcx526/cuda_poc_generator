# ============================================================================
# CUDA PoC Generator - 默认配置文件
# 仅供授权安全研究使用 (Authorized Security Research Only)
# ============================================================================

# --- LLM 配置 ---
# 官方 DeepSeek API，使用 OpenAI 兼容的 Chat Completions 接口。
# Key 在项目根 .env 或进程环境变量中通过 DEEPSEEK_API_KEY 设置。
# 兼容旧的 DEEPSEEK_KEY；其他端点需显式指定自己的 api_key_env。
# 模型以服务商当前可用配置为准，可由 CPG_LLM_MODEL_NAME 覆盖。
llm:
  model_name: "deepseek-flash"
  api_base: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"
  temperature: 0.3
  max_tokens: 4096  # 输出上限；长代码可能截断，需人工检查。
  timeout: 600      # 单次请求读取超时（秒），不是全部重试的总时限。
  max_retries: 3    # 兼容旧字段名：当前实际表示最大尝试次数（含首次）。
  streaming: false # 保留兼容字段；当前代码未实现流式输出。
  use_responses_api: false # 兼容其他支持此协议的端点；官方 DeepSeek 默认使用 Chat Completions。

# --- RAG 知识库配置 ---
rag:
  enabled: true
  chunk_size: 1024
  chunk_overlap: 128
  top_k: 5
  persist_directory: "data/knowledge_bases/.chromadb"
  knowledge_base_dir: "data/knowledge_bases"

# --- 路径配置 ---
paths:
  inputs_dir: "data/inputs"
  outputs_dir: "data/outputs"
  templates_dir: "data/templates"

# --- CUDA 漏洞专项配置 ---
vulnerability:
  vuln_type: "cuda"
  # 7 个输入文件（七维度）的默认文件名 — CUDA 专项定制
  input_files:
    os_environment: "1_os_environment.json"
    cuda_environment: "2_cuda_environment.json"
    affected_component: "3_affected_component.json"
    attack_surface: "4_attack_surface.json"
    vulnerability_type: "5_vulnerability_type.json"
    impact_controllability: "6_impact_controllability.json"
    root_cause: "7_root_cause.json"

# --- 历史迭代字段：保留配置兼容，当前 Single-shot 主流程未接入 ---
iteration:
  max_iterations: 5
  low_confidence_threshold: 0.4
  max_auto_retries: 3

# Read-only platform probing. WSL requires explicit --target-backend wsl.
platform:
  wsl_distro: "Ubuntu-22.04"
  wsl_user: "pocdev"
  wsl_python: "/home/pocdev/.venvs/cuda-poc-generator/bin/python"
  timeout_seconds: 45
  max_output_bytes: 1048576
